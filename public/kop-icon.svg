<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="g-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E6CC97"/>
      <stop offset="45%" stop-color="#C2965A"/>
      <stop offset="100%" stop-color="#82622F"/>
    </linearGradient>
    <linearGradient id="g-bordo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8E2735"/>
      <stop offset="55%" stop-color="#7A1F2B"/>
      <stop offset="100%" stop-color="#46101A"/>
    </linearGradient>
    <radialGradient id="g-vignette" cx="0.5" cy="0.35" r="0.85">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
    </radialGradient>
  </defs>

  <!-- Background bordô -->
  <rect width="1024" height="1024" fill="url(#g-bordo)"/>
  <rect width="1024" height="1024" fill="url(#g-vignette)"/>

  <!-- Chocolate bar grid -->
  <g opacity="0.18" stroke="#F4E6D0" stroke-width="2" fill="none">
    <path d="M 0 341 H 1024 M 0 683 H 1024 M 341 0 V 1024 M 683 0 V 1024"/>
  </g>

  <!-- Gold KPI tile, rotated -->
  <g transform="translate(512 512) rotate(-6) translate(-300 -300)">
    <rect x="0" y="0" width="600" height="600" rx="104" fill="url(#g-gold)"/>
    <rect x="0" y="0" width="600" height="600" rx="104" fill="url(#g-vignette)" opacity="0.55"/>
    <rect x="14" y="14" width="572" height="572" rx="92" fill="none" stroke="#46101A" stroke-opacity="0.22" stroke-width="2"/>
    <!-- Italic k -->
    <text x="96" y="312" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="360" fill="#46101A">k</text>
    <!-- Sparkline bars -->
    <g fill="#46101A" opacity="0.92">
      <rect x="96"  y="440" width="58" height="80"  rx="12"/>
      <rect x="176" y="412" width="58" height="108" rx="12"/>
      <rect x="256" y="376" width="58" height="144" rx="12"/>
      <rect x="336" y="332" width="58" height="188" rx="12"/>
      <rect x="416" y="288" width="58" height="232" rx="12"/>
    </g>
  </g>
</svg>
