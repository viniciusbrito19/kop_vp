<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="kopg" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C2965A"/>
      <stop offset="100%" stop-color="#82622F"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="180" height="180" fill="#FAF7F4"/>

  <!-- Group centralizado: logo original era 40x40, escalamos 3.6x para ~144px, centrado em 90,90 -->
  <g transform="translate(90,90) scale(3.6) translate(-20,-20)">
    <!-- Retângulo escuro traseiro (vermelho bordo) -->
    <rect x="3" y="7" width="28" height="28" rx="6" transform="rotate(-12 17 21)" fill="#7A1F2B"/>
    <!-- Overlay dourado translúcido -->
    <rect x="3" y="7" width="28" height="28" rx="6" transform="rotate(-12 17 21)" fill="url(#kopg)" opacity="0.18"/>
    <!-- Grade de linhas -->
    <g transform="rotate(-12 17 21)" stroke="#FAEFE0" stroke-width="1" opacity="0.32">
      <line x1="12" y1="7" x2="12" y2="35"/>
      <line x1="22" y1="7" x2="22" y2="35"/>
      <line x1="3" y1="16" x2="31" y2="16"/>
      <line x1="3" y1="26" x2="31" y2="26"/>
    </g>
    <!-- Retângulo dourado frontal -->
    <rect x="18" y="3" width="20" height="20" rx="4" transform="rotate(8 28 13)" fill="url(#kopg)"/>
    <!-- Letra k -->
    <text x="28" y="18" text-anchor="middle" fill="#5A1620" font-family="Georgia, serif" font-size="14" font-style="italic" transform="rotate(8 28 13)">k</text>
  </g>
</svg>
